name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8 is the oldest interpreter a game on the kit is played from (an
        # Android/UserLand phone); 3.12 is what Pyodide 0.26 runs in the browser.
        python-version: ['3.8', '3.12']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Run tests with coverage
      run: |
        python -m pytest --verbose -vv --cov=src --cov-report=term-missing --cov-report=xml:cov.xml

    - name: The installed package carries its browser assets
      run: |
        python -c "import tak.web, os; assert all(os.path.exists(tak.web.assetPath(n)) for n in ('client.js','client.css','boot.js','game-worker.js'))"
