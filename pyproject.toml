[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tak"
version = "0.1.0"
description = "Text-adventure kit: one UI contract with console, server-web and in-browser (Pyodide) front-ends, save slots with schema validation, an unlock engine and NPC dialogue - extracted from FishE."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Daniel McCoy Stephenson" }]
dependencies = ["jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/Stephenson-Software/tak"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "autoflake"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tak.web" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
